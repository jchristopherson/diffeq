name: CMake

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            version: '14'
            shared: false
          - os: ubuntu-latest
            compiler: gcc
            version: '14'
            shared: true
          - os: ubuntu-latest
            compiler: gcc
            version: '15'
            shared: false
          - os: ubuntu-latest
            compiler: gcc
            version: '15'
            shared: true
          - os: ubuntu-latest
            compiler: intel
            version: '2026.0'
            shared: false
          - os: ubuntu-latest
            compiler: intel
            version: '2026.0'
            shared: true
          - os: macos-latest
            compiler: gcc
            version: '14'
            shared: false
          - os: macos-latest
            compiler: gcc
            version: '14'
            shared: true
          - os: windows-latest
            compiler: gcc
            version: '14'
            shared: false
          - os: windows-latest
            compiler: gcc
            version: '14'
            shared: true
          - os: windows-latest
            compiler: intel
            version: '2026.0'
            shared: false
          - os: windows-latest
            compiler: intel
            version: '2026.0'
            shared: true

    steps:
      - uses: actions/checkout@v4

      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
      
      - name: Show Fortran compiler version
        run: ${{ env.FC }} --version
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
          CC: ${{ steps.setup-fortran.outputs.cc }}

      - name: Install Intel oneMKL
        if: runner.os == 'Windows' && matrix.compiler == 'intel'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'intel-onemkl-2026.1.0.exe'
          $url = 'https://registrationcenter-download.intel.com/akdlm/IRC_NAS/838e2a31-c5db-429e-93d8-509c08d71ceb/intel-onemkl-2026.1.0.238_offline.exe'
          curl.exe --fail --location --retry 5 --retry-delay 5 --output $installer $url
          if ($LASTEXITCODE -ne 0) { throw "oneMKL download failed: $LASTEXITCODE" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne 'A8334DF5655766C1D2EAA813D7949228A2CCF9AF588CA1A271C37D1B1E802496') {
            throw 'oneMKL installer checksum mismatch'
          }
          $process = Start-Process -FilePath $installer -ArgumentList '-s', '-a', '--silent', '--eula', 'accept' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "oneMKL installation failed: $($process.ExitCode)" }
          Remove-Item $installer
          $mklRoot = Join-Path ${env:ProgramFiles(x86)} 'Intel\oneAPI\mkl\latest'
          if (-not (Test-Path (Join-Path $mklRoot 'lib\mkl_intel_lp64.lib')) -and
              -not (Test-Path (Join-Path $mklRoot 'lib\intel64\mkl_intel_lp64.lib'))) {
            throw "oneMKL LP64 library not found under $mklRoot"
          }
          "MKLROOT=$mklRoot" >> $env:GITHUB_ENV

      - name: Install BLAS/LAPACK dependencies
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libblas-dev liblapack-dev
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew update
            brew install openblas
          elif [ "${{ runner.os }}" = "Windows" ] && [ "${{ matrix.compiler }}" = "gcc" ]; then
            C:/msys64/usr/bin/pacman.exe -S --noconfirm mingw-w64-x86_64-blas mingw-w64-x86_64-lapack
            echo "MSYS2_MINGW_BIN=/c/msys64/mingw64/bin" >> "$GITHUB_ENV"
            echo "LIBRARY_PATH=C:/msys64/mingw64/lib" >> "$GITHUB_ENV"
          fi

      - name: Configure CMake
        shell: bash
        run: |
          CMAKE_OPTIONS=(
            -S .
            -B build
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            -DCMAKE_Fortran_COMPILER=${{ env.FC }}
            -DCMAKE_C_COMPILER=${{ env.CC }}
            -DBUILD_TESTING=TRUE
            -DBUILD_SHARED_LIBS=${{ matrix.shared && 'TRUE' || 'FALSE' }}
          )
          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ matrix.compiler }}" = "intel" ]; then
            CMAKE_OPTIONS+=(
              -G Ninja
              -DCMAKE_Fortran_COMPILER="${CMPLR_ROOT}/bin/ifx.exe"
              -DBLA_VENDOR=Intel10_64lp_seq
              -DBLA_STATIC=ON
              -DBLA_SIZEOF_INTEGER=4
              -DCMAKE_REQUIRE_FIND_PACKAGE_BLAS=TRUE
              -DCMAKE_REQUIRE_FIND_PACKAGE_LAPACK=TRUE
            )
          elif [ "${{ runner.os }}" = "Windows" ]; then
            CMAKE_OPTIONS+=( -G "MinGW Makefiles" )
          fi
          cmake "${CMAKE_OPTIONS[@]}"
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
          CC: ${{ steps.setup-fortran.outputs.cc }}

      - name: Build with CMake
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Test with CMake
        shell: bash
        working-directory: build
        run: |
          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ matrix.compiler }}" = "gcc" ]; then
            export PATH="$PATH:${MSYS2_MINGW_BIN}"
          fi
          ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

      - name: Install with CMake
        run: cmake --install build --prefix ${{ github.workspace }}/install --config ${{ env.BUILD_TYPE }}

      - name: Verify install with CMake consumer
        shell: bash
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(diffeq_consumer LANGUAGES Fortran)

          find_package(diffeq CONFIG REQUIRED)

          add_executable(diffeq_consumer main.f90)
          target_link_libraries(diffeq_consumer PRIVATE diffeq::diffeq)
          EOF

          cat > consumer/main.f90 <<'EOF'
          program main
            use diffeq
            print *, "diffeq package found"
          end program main
          EOF

          CMAKE_OPTIONS=(
            -S consumer
            -B consumer/build
            -DCMAKE_Fortran_COMPILER=${{ env.FC }}
            -DCMAKE_C_COMPILER=${{ env.CC }}
          )
          if [ "${{ runner.os }}" = "Windows" ]; then
            INSTALL_PREFIX="${GITHUB_WORKSPACE//\\//}/install"
            if [ "${{ matrix.compiler }}" = "intel" ]; then
              CMAKE_OPTIONS+=(
                -G Ninja
                -DCMAKE_Fortran_COMPILER="${CMPLR_ROOT}/bin/ifx.exe"
                -DBLA_VENDOR=Intel10_64lp_seq
                -DBLA_STATIC=ON
                -DBLA_SIZEOF_INTEGER=4
                -DCMAKE_REQUIRE_FIND_PACKAGE_BLAS=TRUE
                -DCMAKE_REQUIRE_FIND_PACKAGE_LAPACK=TRUE
              )
            else
              CMAKE_OPTIONS+=(
                -G "MinGW Makefiles"
                -DBLAS_LIBRARIES="C:/msys64/mingw64/lib/libblas.dll.a"
                -DLAPACK_LIBRARIES="C:/msys64/mingw64/lib/liblapack.dll.a;C:/msys64/mingw64/lib/libblas.dll.a"
              )
            fi
          else
            INSTALL_PREFIX="${{ github.workspace }}/install"
          fi
          CMAKE_OPTIONS+=( -DCMAKE_PREFIX_PATH="${INSTALL_PREFIX}" )
          cmake "${CMAKE_OPTIONS[@]}"
          cmake --build consumer/build
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
          CC: ${{ steps.setup-fortran.outputs.cc }}
