name = "diffeq"
version = "2.0.0"
license = "MIT"
author = "Jason Christopherson"
maintainer = "Jason Christopherson"
copyright = "Copyright 2023-2026, Jason Christopherson"
description = "A modern Fortran library providing an object-oriented approach to solving ordinary differential equations."
homepage = "https://github.com/jchristopherson/spectrum"

[library]
source-dir = "src"
include-dir = "src/C"

[fortran]
source-form = "default"
implicit-external = true

[dependencies]
linalg = { git = "https://github.com/jchristopherson/linalg" }

[dev-dependencies]
fortran_test_helper = { git = "https://github.com/jchristopherson/fortran_test_helper" }

[install]
library = true

[build]
link = ["blas", "lapack"]
auto-executables = false
auto-examples = false
auto-tests = false

[[test]]
name = "diffeq_tests"
source-dir = "test"
main = "diffeq_test.f90"

[[test]]
name = "diffeq_auto_diff_tests"
source-dir = "test"
main = "diffeq_auto_diff_tests.f90"

[[test]]
name = "diffeq_dense_output_tests"
source-dir = "test"
main = "diffeq_dense_output_tests.f90"

[[test]]
name = "diffeq_c_api_tests"
source-dir = "test"
main = "diffeq_c_api_tests.c"

[[test]]
name = "diffeq_c_integrator_tests"
source-dir = "test"
main = "diffeq_c_integrator_tests.c"

[[test]]
name = "diffeq_c_event_tests"
source-dir = "test"
main = "diffeq_c_event_tests.c"

[[test]]
name = "diffeq_c_rosenbrock_tests"
source-dir = "test"
main = "diffeq_c_rosenbrock_tests.c"

[[test]]
name = "diffeq_c_dae_integrator_tests"
source-dir = "test"
main = "diffeq_c_dae_integrator_tests.c"
